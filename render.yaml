services:
  - type: web
    name: shopeasy-ecommerce
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_FILE
        value: /var/data/shopeasy.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: shopeasy-data
      mountPath: /var/data
      sizeGB: 1
