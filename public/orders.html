<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders – ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar">
        <a href="/index.html" class="brand-logo">
          🛍️ Shop<span>Easy</span>
        </a>

        <ul class="nav-links">
          <li class="nav-item"><a href="/index.html">Catalog</a></li>
          <li class="nav-item">
            <a href="/cart.html" class="cart-link" id="cart-nav-link">
              🛒 Cart
              <span class="cart-badge" id="nav-cart-badge" style="display:none;">0</span>
            </a>
          </li>
          <li class="nav-item" id="nav-auth-container"></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h1 style="font-size:1.85rem; font-weight:800; color:var(--secondary);">
          My Order History
        </h1>
        <a href="/index.html" class="btn btn-secondary btn-sm">Shop More Products</a>
      </div>

      <!-- Empty state -->
      <div id="orders-empty-state" style="display:none; text-align:center; padding:4rem 1rem; background:var(--bg-card); border-radius:var(--radius-lg); border:1px solid var(--border);">
        <div style="font-size:3.5rem; margin-bottom:1rem;">📦</div>
        <h3 style="font-size:1.35rem; font-weight:700; margin-bottom:0.5rem;">No orders found</h3>
        <p style="color:var(--text-muted); margin-bottom:1.5rem;">You haven't placed any orders yet. Discover great deals in our catalog!</p>
        <a href="/index.html" class="btn btn-primary">Browse Catalog</a>
      </div>

      <!-- Orders List Container -->
      <div id="orders-list">
        <p style="padding:2rem; text-align:center; color:var(--text-muted);">Loading your order history...</p>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 ShopEasy Application. Full-Stack Internship Capstone Project.
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
