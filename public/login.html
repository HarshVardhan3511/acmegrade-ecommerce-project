<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar">
        <a href="/index.html" class="brand-logo">
          🛍️ Shop<span>Easy</span>
        </a>
        <ul class="nav-links">
          <li class="nav-item"><a href="/index.html">← Back to Store</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-header">
          <h1>Welcome Back</h1>
          <p>Sign in to your ShopEasy account</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email" />
          </div>

          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
              <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
            </div>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1.25rem; font-weight:700;">
            Sign In ➔
          </button>
        </form>

        <!-- Quick Demo Credentials for Viva / Evaluation -->
        <div class="demo-credentials" style="margin-top:1.25rem;">
          <strong style="font-size:0.82rem; margin-bottom:0.5rem;">⚡ Quick Demo Login:</strong>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-top:0.35rem;">
            <button type="button" class="btn btn-sm btn-secondary" id="fill-admin-btn" style="font-size:0.8rem; justify-content:center;">
              👑 Use Admin
            </button>
            <button type="button" class="btn btn-sm btn-secondary" id="fill-customer-btn" style="font-size:0.8rem; justify-content:center;">
              👤 Use Customer
            </button>
          </div>
        </div>

        <div style="margin-top:1.5rem; text-align:center; border-top:1px solid var(--border); padding-top:1.25rem;">
          <p style="font-size:0.88rem; color:var(--text-muted); margin-bottom:0.75rem;">New to ShopEasy?</p>
          <a href="/register.html" class="btn btn-outline btn-block" style="font-weight:700;">
            ✨ Create Free Account
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 ShopEasy Application. Full-Stack Internship Capstone Project.
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
