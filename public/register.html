<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar">
        <a href="/index.html" class="brand-logo">
          🛍️ Shop<span>Easy</span>
        </a>
        <ul class="nav-links">
          <li class="nav-item"><a href="/index.html">← Back to Store</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="auth-wrapper" style="max-width:480px;">
        <div class="auth-header">
          <h1>Create an Account</h1>
          <p>Join ShopEasy for quick checkout and order tracking</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name *</label>
            <input type="text" id="name" class="form-control" placeholder="John Doe" required minlength="2" />
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required />
            <div class="form-text">We'll use this for your login and order confirmations.</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="9876543210" pattern="[0-9+() -]{10,15}" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password *</label>
            <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6" />
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password *</label>
            <input type="password" id="confirm_password" class="form-control" placeholder="Confirm your password" required minlength="6" />
          </div>

          <div class="form-group">
            <label class="form-label" for="address">Delivery Address (Optional)</label>
            <textarea id="address" class="form-control" rows="2" placeholder="Street, Flat/House number, Area"></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1.5rem;">
            Create My Account
          </button>
        </form>

        <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--text-muted);">
          Already have an account? <a href="/login.html" style="font-weight:700;">Sign in here</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 ShopEasy Application. Full-Stack Internship Capstone Project.
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
