<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile – ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar">
        <a href="/index.html" class="brand-logo">
          🛍️ Shop<span>Easy</span>
        </a>

        <ul class="nav-links">
          <li class="nav-item"><a href="/index.html">Catalog</a></li>
          <li class="nav-item"><a href="/orders.html">My Orders</a></li>
          <li class="nav-item">
            <a href="/cart.html" class="cart-link" id="cart-nav-link">
              🛒 Cart
              <span class="cart-badge" id="nav-cart-badge" style="display:none;">0</span>
            </a>
          </li>
          <li class="nav-item" id="nav-auth-container"></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="cart-card" style="max-width:600px; margin:2rem auto; padding:2.5rem;">
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; border-bottom:1px solid var(--border); padding-bottom:1rem;">
          <div>
            <h1 style="font-size:1.6rem; font-weight:800; color:var(--secondary);">Profile Settings</h1>
            <small style="color:var(--text-muted);">Manage your personal information and default shipping details</small>
          </div>
          <span class="badge badge-info" id="profile-role">CUSTOMER</span>
        </div>

        <form id="profile-form">
          <div class="form-group">
            <label class="form-label" for="profile-name">Full Name *</label>
            <input type="text" id="profile-name" class="form-control" required minlength="2" />
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-email">Email Address</label>
            <input type="email" id="profile-email" class="form-control" disabled style="background:#f1f5f9; cursor:not-allowed;" />
            <div class="form-text">Email address is linked to your account and cannot be modified.</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-phone">Phone Number</label>
            <input type="tel" id="profile-phone" class="form-control" placeholder="9812345678" pattern="[0-9+() -]{10,15}" />
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-address">Default Delivery Address</label>
            <textarea id="profile-address" class="form-control" rows="3" placeholder="Enter default street address for faster checkout"></textarea>
          </div>

          <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1.5rem;">
            Account Member Since: <strong id="profile-joined">...</strong>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Save Changes
          </button>
        </form>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 ShopEasy Application. Full-Stack Internship Capstone Project.
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
